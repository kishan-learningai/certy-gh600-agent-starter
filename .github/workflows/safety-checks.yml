name: Safety checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-fund --no-audit
      - name: Type check
        run: npm run typecheck
      - name: Guardrail tests
        run: node --import tsx --test "tests/guardrails.test.ts"
